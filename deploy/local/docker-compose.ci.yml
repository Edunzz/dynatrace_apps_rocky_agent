# CI integration environment: Rocky runtime (Claude Code) + mock Anthropic API.
#
# The Dynatrace URL points to a reserved, unresolvable domain on purpose so the
# runtime starts in degraded mode ("Dynatrace connection: unavailable").
# No real credential is used: Claude Code talks to the mock through
# ANTHROPIC_BASE_URL with a placeholder key.
#
#   ROCKY_IMAGE=rocky-agent:ci docker compose -f deploy/local/docker-compose.ci.yml up -d

name: rocky-agent-ci

services:
  mock-anthropic:
    image: node:24.22.2-bookworm-slim@sha256:c86ecead9e55a5210ac1727de38a4ca840bf03dcaf34dc9749addbf383b1920c
    command: ["node", "/mock/mock-anthropic.mjs"]
    environment:
      MOCK_LLM_HOST: 0.0.0.0
      MOCK_LLM_PORT: "8089"
    volumes:
      - ../../agent-runtime/tests/integration:/mock:ro

  rocky-agent:
    image: ${ROCKY_IMAGE:-rocky-agent:ci}
    depends_on:
      - mock-anthropic
    environment:
      NODE_ENV: test
      DT_PLATFORM_URL: https://rocky-ci.invalid
      DT_PLATFORM_TOKEN: ci-placeholder-not-a-real-token
      ROCKY_SERVER_PASSWORD: ci-integration-password-0123
      ANTHROPIC_BASE_URL: http://mock-anthropic:8089
      ANTHROPIC_API_KEY: ci-mock-anthropic-key-not-real
      LOG_LEVEL: info
    ports:
      - "127.0.0.1:4096:4096"
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /home/rocky:size=1g,uid=10001,gid=10001,mode=0700
      - /workspace:size=256m,uid=10001,gid=10001,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
