apiVersion: v1
kind: ConfigMap
metadata:
  name: rocky-agent-config
data:
  # Non-secret settings only. Secrets live in the rocky-agent-secrets Secret.
  DT_PLATFORM_URL: "https://abc12345.apps.dynatrace.com"
  ROCKY_SERVER_USERNAME: "rocky"
  ROCKY_PORT: "4096"
  # Optional: model alias (sonnet, opus) or full name; empty uses Claude Code's default.
  ROCKY_MODEL: "sonnet"
  WORKSPACE_PATH: "/workspace"
  LOG_LEVEL: "info"
  NODE_ENV: "production"
  DTCTL_SAFETY_LEVEL: "readwrite-mine"
