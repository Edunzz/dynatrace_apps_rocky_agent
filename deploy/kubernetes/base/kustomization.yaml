apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rocky-agent
labels:
  - pairs:
      app.kubernetes.io/name: rocky-agent
      app.kubernetes.io/part-of: rocky-agent
    includeSelectors: false
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - networkpolicy.yaml
# secret.example.yaml is intentionally NOT listed: create the Secret with your
# secret manager (External Secrets, Sealed Secrets, CSI driver) or kubectl.
