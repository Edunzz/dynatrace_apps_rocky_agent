# EXAMPLE ONLY: never commit real values. Prefer External Secrets Operator,
# Sealed Secrets or the Secrets Store CSI driver, or create the Secret with:
#
#   kubectl -n rocky-agent create secret generic rocky-agent-secrets \
#     --from-file=DT_PLATFORM_TOKEN=./token.txt \
#     --from-file=OPENCODE_SERVER_PASSWORD=./password.txt \
#     --from-file=ANTHROPIC_API_KEY=./anthropic.txt
apiVersion: v1
kind: Secret
metadata:
  name: rocky-agent-secrets
type: Opaque
stringData:
  DT_PLATFORM_TOKEN: "<platform token of a dedicated service user>"
  OPENCODE_SERVER_PASSWORD: "<at least 16 characters>"
  ANTHROPIC_API_KEY: "<model provider key, or remove and use another provider>"
