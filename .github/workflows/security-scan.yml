name: security-scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  dependency-audit:
    name: Dependency audit (npm)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Audit Dynatrace App production dependencies
        if: hashFiles('dynatrace-app/package-lock.json') != ''
        working-directory: dynatrace-app
        run: npm audit --omit=dev --audit-level=high
      - name: Runtime has no third-party npm dependencies
        working-directory: agent-runtime
        run: |
          node -e 'const p=require("./package.json"); const n=Object.keys({...p.dependencies,...p.devDependencies}).length; if (n) { console.error(`unexpected dependencies: ${n}`); process.exit(1) }'

  image-scan:
    name: Image SBOM and vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: agent-runtime
          load: true
          tags: rocky-agent:scan
          cache-from: type=gha
      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: rocky-agent:scan
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true
      - name: Vulnerability scan (Grype)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: rocky-agent:scan
          fail-build: true
          severity-cutoff: critical
          only-fixed: true
          output-format: table

  iac-validation:
    name: Infrastructure as code validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
      - name: Terraform (Amazon ECS)
        working-directory: deploy/aws-ecs/terraform
        run: terraform fmt -check -recursive && terraform init -backend=false -input=false && terraform validate
      - name: Terraform (Azure Container Apps)
        working-directory: deploy/azure-container-apps/terraform
        run: terraform fmt -check -recursive && terraform init -backend=false -input=false && terraform validate
      - name: CloudFormation lint
        run: |
          python3 -m pip install --quiet "cfn-lint==1.59.0"
          cfn-lint deploy/aws-ecs/cloudformation/rocky-agent.yaml
      - name: Bicep build
        run: az bicep build --file deploy/azure-container-apps/bicep/main.bicep --stdout > /dev/null
      - name: Kubernetes manifests (kustomize + kubeconform)
        run: |
          curl -fsSLO https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          echo "${KUBECONFORM_SHA256}  kubeconform-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf kubeconform-linux-amd64.tar.gz kubeconform
          kubectl kustomize deploy/kubernetes/examples/production > rendered.yaml
          ./kubeconform -strict -summary rendered.yaml deploy/kubernetes/examples/autoscaling/hpa.yaml deploy/kubernetes/base/secret.example.yaml
        env:
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
