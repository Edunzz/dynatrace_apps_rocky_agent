name: app-validation

on:
  pull_request:
    paths:
      - "dynatrace-app/**"
      - ".github/workflows/app-validation.yml"
  push:
    branches: [main]
    paths:
      - "dynatrace-app/**"
      - ".github/workflows/app-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Type check, lint, test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: dynatrace-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dynatrace-app/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type check (UI and functions)
        run: npm run typecheck
      - name: Lint (ESLint with security rules)
        run: npm run lint
      - name: Unit and UI tests
        run: npx jest --ci
      - name: Build the app (dt-app)
        run: npx dt-app build --non-interactive
      - name: Upload build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rocky-agent-app-dist
          path: dynatrace-app/dist
          retention-days: 7
